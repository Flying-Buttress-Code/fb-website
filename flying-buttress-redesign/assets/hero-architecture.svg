<ellipse cx="453" cy="718" rx="324" ry="80" fill="#243D43" opacity=".22" filter="url(#shadow)"/>
<!-- left structural anchor -->
<path d="M114 468 252 416V737L114 786Z" fill="url(#face)"/>
<path d="M252 416 294 440V751L252 737Z" fill="url(#side)"/>
<path d="M114 468 157 490 294 440 252 416Z" fill="#FCF8EF"/>
<path d="M114 468V786l43 24V489Z" fill="#D7DAD1"/>
