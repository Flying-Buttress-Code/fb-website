<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 850" role="img" aria-labelledby="title desc">
<title id="title">A contemporary architectural interpretation of a flying buttress</title>
<desc id="desc">Tall limestone columns joined by an elevated structural arch, with precise drawing marks and terracotta accent shapes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDDAD0"/><stop offset="1" stop-color="#BFCAC4"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#F9F2E8"/><stop offset="1" stop-color="#D9D6CC"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#AAB6B0"/><stop offset="1" stop-color="#6D898B"/></linearGradient>
 <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D3D9D2"/><stop offset="1" stop-color="#A1B1AD"/></linearGradient>
 <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#516874" stroke-width=".75" opacity=".18"/></pattern>
 <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
 <pattern id="specks" width="70" height="58" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r=".7" fill="#18313A" opacity=".22"/><circle cx="42" cy="36" r=".7" fill="#18313A" opacity=".15"/></pattern>
</defs>
<rect width="820" height="850" fill="url(#bg)"/>
<rect width="820" height="850" fill="url(#grid)"/>
