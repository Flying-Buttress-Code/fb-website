<path d="m566 255 177-60" stroke="#FFF7E9" stroke-width="3" opacity=".85"/>
<g stroke="#91A5A1" stroke-width="1" opacity=".44"><path d="m489 332 77 43 176-62M489 472l77 43 176-62M489 612l77 43 176-62"/><path d="M610 241v554M662 225v548"/></g>
<!-- flying load-bearing structural arc -->
<path d="M250 484Q345 347 490 347V417Q369 431 289 538Z" fill="#17343F"/>
<path d="M251 484Q345 347 490 347L528 367Q390 374 292 515Z" fill="#F8F2E6"/>
<path d="M292 515Q390 374 528 367v61Q389 435 331 548Z" fill="#849DA0"/>
